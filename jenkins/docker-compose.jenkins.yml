version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: pickmeup-jenkins
    user: root                          # Docker 소켓 접근에 필요
    ports:
      - "8080:8080"                     # Jenkins UI
      - "50000:50000"                   # Jenkins Agent 포트
    volumes:
      - jenkins-data:/var/jenkins_home  # Jenkins 데이터 영구 보존
      - /var/run/docker.sock:/var/run/docker.sock  # Docker-in-Docker (소켓 마운트)
      - /usr/bin/docker:/usr/bin/docker            # Docker 바이너리
    environment:
      - JAVA_OPTS=-Duser.timezone=Asia/Seoul
    restart: unless-stopped

volumes:
  jenkins-data:
