spring:
  application:
    name: pickmeup
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/pickmeup?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:pickmeup}
    password: ${DB_PASSWORD:pickmeup123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true  # data.sql 로딩 활성화

  sql:
    init:
      mode: always  # 항상 data.sql 실행 (프로덕션에서는 never로 변경!)

  data:
    # MongoDB: 비활성화 (mysql로 이전)
    # mongodb: ss
    #   uri: ${MONGODB_URI:mongodb://localhost:27017/pickmeup}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: smtp.gmail.com
    port:
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

app:
  upload:
    path: ${FILE_UPLOAD_DIR:./uploads}
    max-size: 10485760
  mail:
    enabled: ${MAIL_ENABLED:false}  # true로 바꾸면 실제 이메일 발송

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiry: ${JWT_ACCESS_EXPIRY:3600000}
  refresh-token-expiry: ${JWT_REFRESH_EXPIRY:604800000}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/auth/kakao/callback}
  sender-key: ${KAKAO_SENDER_KEY:}
  notification:
    enabled: ${KAKAO_NOTIFICATION_ENABLED:false}

# NCP SENS (SMS 서비스)
ncp:
  sens:
    service-id: ${NCP_SENS_SERVICE_ID:}
    access-key: ${NCP_SENS_ACCESS_KEY:}
    secret-key: ${NCP_SENS_SECRET_KEY:}
    from-number: ${NCP_SENS_FROM_NUMBER:}
    enabled: ${NCP_SENS_ENABLED:false}

openai:
  api-key: ${OPENAI_API_KEY:}
  daily-limit: ${OPENAI_DAILY_LIMIT:5}

serpapi:
  api-key: ${SERPAPI_API_KEY:}

server:
  port: ${SERVER_PORT:8082}

logging:
  level:
    com.pickmeup: ${LOG_LEVEL:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
