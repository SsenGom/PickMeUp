spring:
  application:
    name: pickmeup
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

file:
  upload-dir: ./uploads

---
spring:
  config:
    activate:
      on-profile: local
  
  datasource:
    url: jdbc:mysql://localhost:3307/pickmeup?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: pickmeup
    password: pickmeup123
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  data:
    mongodb:
      uri: mongodb://pickmeup:pickmeup123@localhost:27017/pickmeup?authSource=admin
    redis:
      host: localhost
      port: 6379
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:pickmeup-local-secret-key-must-be-at-least-256-bits-long}
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/auth/kakao/callback}

openai:
  api-key: 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
  daily-limit: 5

serpapi:
  api-key: ${SERPAPI_API_KEY:}

server:
  port: 8080

logging:
