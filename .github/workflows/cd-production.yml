name: CD - Deploy to Production

on:
  push:
    tags:
      - 'v*'  # v1.0.0, v1.1.0 등

jobs:
  # ==================== 배포 ====================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: 체크아웃
      uses: actions/checkout@v3
    
    - name: 버전 추출
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    # ==================== 백엔드 배포 ====================
    - name: Java 17 설정
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: 백엔드 빌드
      run: |
        cd backend
        chmod +x gradlew
        ./gradlew build -x test
    
    - name: Docker 이미지 빌드 & 푸시
      run: |
        echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
        
        # 백엔드
        docker build -t ${{ secrets.DOCKER_USERNAME }}/pickmeup-backend:${{ steps.version.outputs.VERSION }} ./backend
        docker push ${{ secrets.DOCKER_USERNAME }}/pickmeup-backend:${{ steps.version.outputs.VERSION }}
        
        # 프론트엔드
        docker build -t ${{ secrets.DOCKER_USERNAME }}/pickmeup-frontend:${{ steps.version.outputs.VERSION }} ./frontend
        docker push ${{ secrets.DOCKER_USERNAME }}/pickmeup-frontend:${{ steps.version.outputs.VERSION }}
    
    # ==================== 서버 배포 (SSH) ====================
    - name: SSH로 서버 배포
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /app/pickmeup
          
          # 최신 코드 받기
          git pull origin main
          
          # 환경변수 설정
          export VERSION=${{ steps.version.outputs.VERSION }}
          
          # Docker Compose로 재시작
          docker-compose pull
          docker-compose up -d
          
          # 헬스체크
          sleep 10
          curl -f http://localhost:8080/actuator/health || exit 1
    
    # ==================== Slack 알림 ====================
    - name: Slack 알림
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: |
          배포 ${{ job.status }}!
          버전: ${{ steps.version.outputs.VERSION }}
          담당자: ${{ github.actor }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # ==================== GitHub Release ====================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
    - name: 체크아웃
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Changelog 생성
      id: changelog
      uses: mikepenz/release-changelog-builder-action@v3
      with:
        configuration: ".github/changelog-config.json"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: GitHub Release 생성
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: ${{ steps.changelog.outputs.changelog }}
        draft: false
        prerelease: false
