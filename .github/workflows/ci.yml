name: CI - Test & Build

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop ]

jobs:
  # ==================== 백엔드 테스트 ====================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: 체크아웃
      uses: actions/checkout@v3
    
    - name: Java 17 설정
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Gradle 권한 부여
      run: chmod +x backend/gradlew
    
    - name: 테스트 실행
      run: |
        cd backend
        ./gradlew test --no-daemon
    
    - name: 테스트 리포트 업로드
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: backend-test-results
        path: backend/build/reports/tests/test/
    
    - name: 커버리지 체크
      run: |
        cd backend
        ./gradlew jacocoTestReport
    
    - name: 커버리지 업로드 (Codecov)
      uses: codecov/codecov-action@v3
      with:
        files: backend/build/reports/jacoco/test/jacocoTestReport.xml
        flags: backend
  
  # ==================== 백엔드 빌드 ====================
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend-test
    
    steps:
    - name: 체크아웃
      uses: actions/checkout@v3
    
    - name: Java 17 설정
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: 빌드
      run: |
        cd backend
        chmod +x gradlew
        ./gradlew build -x test
    
    - name: JAR 파일 업로드
      uses: actions/upload-artifact@v3
      with:
        name: backend-jar
        path: backend/build/libs/*.jar
  
  # ==================== 프론트엔드 테스트 ====================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: 체크아웃
      uses: actions/checkout@v3
    
    - name: Node.js 설정
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: 의존성 설치
      run: |
        cd frontend
        npm ci
    
    - name: 린트 검사
      run: |
        cd frontend
        npm run lint
    
    - name: 타입 체크
      run: |
        cd frontend
        npm run type-check
    
    # TODO: 프론트엔드 테스트 추가 시
    # - name: 테스트 실행
    #   run: |
    #     cd frontend
    #     npm run test
  
  # ==================== 프론트엔드 빌드 ====================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-test
    
    steps:
    - name: 체크아웃
      uses: actions/checkout@v3
    
    - name: Node.js 설정
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: 의존성 설치
      run: |
        cd frontend
        npm ci
    
    - name: 빌드
      run: |
        cd frontend
        npm run build
    
    - name: 빌드 파일 업로드
      uses: actions/upload-artifact@v3
      with:
        name: frontend-dist
        path: frontend/dist/

  # ==================== 도커 이미지 빌드 (선택) ====================
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    
    steps:
    - name: 체크아웃
      uses: actions/checkout@v3
    
    - name: Docker 메타데이터
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: |
          ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
    
    - name: Docker Buildx 설정
      uses: docker/setup-buildx-action@v2
    
    - name: GHCR 로그인
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 백엔드 이미지 빌드 & 푸시
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: ${{ steps.meta.outputs.tags }}-backend
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: 프론트엔드 이미지 빌드 & 푸시
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: ${{ steps.meta.outputs.tags }}-frontend
        cache-from: type=gha
        cache-to: type=gha,mode=max
